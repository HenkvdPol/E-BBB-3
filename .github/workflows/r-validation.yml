name: R validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_checks:
        description: "Run the full exact/validity/regression check suite"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.2"
      - name: Parse all R sources
        run: Rscript scripts/parse_all.R
      - name: Focused framework engine checks
        run: Rscript checks/fw_engine.R

  full-checks:
    if: github.event_name == 'workflow_dispatch' && inputs.full_checks == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.2"
      - name: Parse all R sources
        run: Rscript scripts/parse_all.R
      - name: Full exact, validity, regression and unit checks
        run: |
          Rscript checks/fw_validity.R
          Rscript checks/exact_checks.R
          Rscript checks/regression.R
          Rscript checks/unit_flex.R
